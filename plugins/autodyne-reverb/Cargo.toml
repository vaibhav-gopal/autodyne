[package]
name = "autodyne-reverb"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only OR LicenseRef-Royalty-Free-1.0 OR LicenseRef-Commercial-1.0"
description = "autodyne's feedback-delay-network reverb as a CLAP and VST3 plugin"

[lib]
# cdylib is the plugin; lib lets the tests link against it
crate-type = ["cdylib", "lib"]

[features]
default = ["vst3"]
# VST3 export (the bindings are MIT OR Apache-2.0); CLAP is always built
vst3 = ["nice-plug/vst3"]

[dependencies]
autodyne = { path = "../.." }
autodyne-plug = { path = "../autodyne-plug" }
# assert_process_allocs: debug builds abort if the audio callback allocates
nice-plug = { version = "0.4.2", default-features = false, features = ["assert_process_allocs"] }
