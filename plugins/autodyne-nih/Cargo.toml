[package]
name = "autodyne-nih"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bridges autodyne processors to NIH-plug (CLAP / VST3 plugins)"

[dependencies]
autodyne = { path = "../.." }
# pinned for reproducible builds; no default features, so VST3 (GPLv3 bindings) is opt-in per plugin
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
