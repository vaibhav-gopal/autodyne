[package]
name = "autodyne-plug"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "autodyne processors as CLAP / VST3 plugins, through nice-plug"

[dependencies]
autodyne = { path = "../.." }
# no default features: no GUI toolkit or logger, and each plugin opts into VST3
nice-plug = { version = "0.4.2", default-features = false }
