name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (used by the `live` example) links against ALSA on Linux
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # an editor once left a U+FEFF mid-file in src/units/ops.rs, which rustc rejects; catch it here
      - name: No byte-order marks
        if: runner.os == 'Linux'
        run: |
          if git grep -nIF $'\xEF\xBB\xBF'; then echo "remove the byte-order marks above"; exit 1; fi
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test the portable FFT (without the rustfft backend)
        run: cargo test -p autodyne --no-default-features --features std --lib fft
      - name: Test with the ndarray interop
        run: cargo test -p autodyne --features ndarray --lib
      # the JIT compiles flux's scans with Cranelift; GPU tests skip themselves without an adapter
      - name: Test the JIT and GPU features
        # (quoted: ": " in a plain YAML value starts a mapping)
        run: "cargo test -p autodyne --features jit,gpu --lib -- flux:: gpu::"
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Docs build without warnings
        run: cargo doc --workspace --exclude xtask --no-deps --features autodyne/flux,autodyne/jit,autodyne/gpu
        env:
          RUSTDOCFLAGS: -D warnings
      # `live` needs a sound device, so CI only builds it (via --all-targets above)
      - name: Examples run
        run: |
          cargo run --release --example simple
          cargo run --release --example tone
          cargo run --release --example fm_radio
          cargo run --release --example effects
          cargo run --release --example host -- f64 threshold_db=-30
          cargo run --release --example interop
          cargo run --release --example reverb
          cargo run --release --example sampler
      - name: Plugin bundles
        run: cargo xtask bundle -p autodyne-reverb -p autodyne-synth --release
      - name: Benchmarks compile
        run: cargo bench --no-run
      # The crate is warning-free; keep it that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features autodyne/ndarray,autodyne/flux,autodyne/jit,autodyne/gpu -- -D warnings

  # The core without std (core + alloc, libm for float maths): tested on the host (the tests link
  # std, the code under test doesn't) and built for the browser.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # the tests build the dev-dependencies, cpal among them (ALSA on Linux)
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test without std
        run: cargo test -p autodyne --no-default-features
      - name: Clippy without std
        run: cargo clippy -p autodyne --no-default-features --lib --tests -- -D warnings
      - name: Build for wasm32
        run: cargo build -p autodyne --no-default-features --lib --target wasm32-unknown-unknown

  # The n-d views are raw pointers over validated layouts: check their unsafe code for undefined
  # behaviour (Miri's float noise is turned off so exact-equality assertions stay meaningful).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Miri (n-d views, runtime-typed views, DLPack, interop)
        # (+nightly: rust-toolchain.toml pins stable for everything else)
        run: "cargo +nightly miri test --lib --features ndarray -- signal::nd dynamic:: dlpack interop"
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-deterministic-floats

  # The Python bindings (their own workspace): build with maturin, test against NumPy and SciPy.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: astral-sh/setup-uv@v7
      - name: Build and install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv maturin numpy scipy pytest
          VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --release --uv
      - name: Test
        run: .venv/bin/python -m pytest tests -q

  # flux end to end: trace, differentiate, emit StableHLO, compile and run it with IREE, a PJRT plugin
  # (XLA CPU, loaded in-process) and XLA through JAX.
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install IREE and JAX (XLA)
        run: |
          uv venv .flux --python 3.12
          uv pip install --python .flux iree-base-compiler==3.11.0 iree-base-runtime==3.11.0 jax==0.11.2
          .flux/bin/iree-compile --version
          .flux/bin/python -c "import jax; print(jax.devices())"
          echo "AUTODYNE_IREE_DIR=$PWD/.flux/bin" >> "$GITHUB_ENV"
          echo "AUTODYNE_XLA_PYTHON=$PWD/.flux/bin/python" >> "$GITHUB_ENV"
      - name: Install the PJRT CPU plugin
        run: |
          mkdir -p .pjrt
          curl -sSL https://github.com/zml/pjrt-artifacts/releases/download/manual-2026-09-08T13-23-00Z/pjrt-cpu_linux-amd64.tar.gz | tar xz -C .pjrt
          echo "AUTODYNE_PJRT_PLUGIN=$PWD/.pjrt/libpjrt_cpu.so" >> "$GITHUB_ENV"
      - name: Test (interpreter)
        run: cargo test -p autodyne --features flux --lib flux
      - name: Test (IREE, PJRT, XLA)
        run: cargo test -p autodyne --features flux --test flux -- --nocapture

  # RustSec advisories, banned crates, dependency sources: see deny.toml
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # on the runner, not cargo-deny-action's container: its musl toolchain isn't the one
      # rust-toolchain.toml asks for
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # (licenses are Tend's: tend check judges them against the baseline's library combo)
      - name: cargo deny
        run: cargo deny --workspace check advisories bans sources