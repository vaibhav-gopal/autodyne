name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (used by the `live` example) links against ALSA on Linux
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc
      - name: Docs build without warnings
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # `live` needs a sound device, so CI only builds it (via --all-targets above)
      - name: Examples run
        run: |
          cargo run --release --example tone
          cargo run --release --example fm_radio
          cargo run --release --example effects
          cargo run --release --example host -- f64 threshold_db=-30
          cargo run --release --example interop
      - name: Benchmarks compile
        run: cargo bench --no-run
      # The crate is warning-free; keep it that way.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
