name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (used by the `live` example) links against ALSA on Linux
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Docs build without warnings
        run: cargo doc --workspace --exclude xtask --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # `live` needs a sound device, so CI only builds it (via --all-targets above)
      - name: Examples run
        run: |
          cargo run --release --example tone
          cargo run --release --example fm_radio
          cargo run --release --example effects
          cargo run --release --example host -- f64 threshold_db=-30
          cargo run --release --example interop
          cargo run --release --example reverb
      - name: Plugin bundles
        run: cargo xtask bundle -p autodyne-reverb -p autodyne-synth --release
      - name: Benchmarks compile
        run: cargo bench --no-run
      # The crate is warning-free; keep it that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # licenses (third-party must be permissive), RustSec advisories, dependency sources: see deny.toml
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace
          command: check