name: CLA

# Asks pull request authors to sign CLA.md once, by commenting on the pull request. Signatures are
# stored in signatures/version1/cla.json on the `cla-signatures` branch, so they never touch main.
#
# pull_request_target runs with write access, so this workflow must never check out or run code
# from the pull request; it only reads comments and writes the signature file.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # StepSecurity's maintained fork of contributor-assistant/github-action (archived in 2026),
        # pinned to the v2.6.1 commit
        uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/vaibhav-gopal/autodyne/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # the maintainer and bots don't sign
          allowlist: vaibhav-gopal,*[bot]
          lock-pullrequest-aftermerge: false
