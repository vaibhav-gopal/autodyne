# Weekly dependency updates. Each update is a pull request, checked locally before it's merged (README,
# Tests and benchmarks: cargo-deny's advisories and tend check's licenses among the checks); after a merge,
# `cargo xtask notices` refreshes the plugins' third-party notices.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # one pull request for all compatible updates; breaking (major) updates come separately
      compatible:
        update-types: [minor, patch]
