# cargo-deny policy: `cargo deny check advisories bans sources` (runs in CI).
#
# Licenses are not checked here: autodyne is licensed under the vg-paradigms baseline's library combo
# (.tend/extends.toml), and `tend check` judges every shipping dependency's license against what
# that combo's options allow (and DCO sign-offs on contributions). This file keeps the rest:
# security advisories, banned or duplicated crates, and where crates come from.

[graph]
# dev-dependencies (examples, tests, benchmarks) never ship in a product
exclude-dev = true
all-features = true

[advisories]
# RustSec: known vulnerabilities fail the check; unmaintained crates only when we depend on them
# directly (the plugin framework's dependency tree is not ours to fix)
unmaintained = "workspace"

[bans]
# duplicate versions cost build time, not correctness
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: a git or other registry dependency needs a deliberate exception here
unknown-registry = "deny"
unknown-git = "deny"
