[package]
name = "autodyne-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for autodyne: zero-copy array exchange with NumPy (and PyTorch, JAX...) through DLPack"
license = "GPL-3.0-only"
publish = false

[lib]
name = "_autodyne"
crate-type = ["cdylib"]

[dependencies]
num-complex = "0.4"
autodyne = { path = "../..", features = ["ndarray", "jit", "mimalloc"] }
# An extension module is dlopen'ed: mimalloc's default initial-exec TLS then fails on Linux with
# "cannot allocate memory in static TLS block". Its local-dynamic TLS is the model for that case.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[features]
# arrays in GPU memory (autodyne.gpu), through wgpu
default = ["gpu"]
gpu = ["autodyne/gpu"]

# A workspace of its own: building it needs a Python toolchain, which the core crate's builds don't.
[workspace]
