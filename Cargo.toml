[package]
name = "autodyne"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.12"

[dev-dependencies]
cpal = "0.18.2"
criterion = "0.6.0"
hound = "3.5.1"
midir = "0.11.0"
rtrb = "0.4.0"

[features]
default = []

[[bench]]
name = "dsp"
harness = false

# The library is the root package; plugins and the bundler live alongside it so `autodyne` itself
# never depends on a plugin framework.
[workspace]
members = [".", "plugins/autodyne-nih", "plugins/autodyne-reverb", "plugins/autodyne-synth", "xtask"]
