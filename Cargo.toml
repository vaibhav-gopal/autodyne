[package]
name = "autodyne"
version = "0.1.0"
edition = "2021"
description = "DSP and numerical library: signals, filters, spectral, dynamics, reverb, synthesis, runtime-typed buffers and parameters"
license = "GPL-3.0-only"
# not on crates.io (yet); also keeps it out of the third-party notices (about.toml)
publish = false
repository = "https://github.com/vaibhav-gopal/autodyne"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg", "rayon"], optional = true }
libloading = { version = "0.8", optional = true }
mimalloc = { version = "0.1", optional = true }
ndarray = { version = "0.17.2", default-features = false, features = ["std"], optional = true }
realfft = { version = "3.5.0", optional = true }
rustfft = { version = "6.4.1", optional = true }
thiserror = "2.0.12"

[dev-dependencies]
cpal = "0.18.2"
criterion = "0.8.2"
hound = "3.5.1"
midir = "0.11.0"
rtrb = "0.4.0"
serde_json = "1"

[features]
# rustfft: the FFT backend (AVX / SSE / NEON mixed-radix kernels); without it, a portable radix-2
default = ["rustfft", "faer"]
ndarray = ["dep:ndarray"]
# flux: trace, differentiate and emit StableHLO; IREE / XLA run as external tools, or PJRT plugins
# loaded at run time (libloading)
flux = ["dep:libloading"]
rustfft = ["dep:rustfft", "dep:realfft"]
# faer: linear algebra (solve, least squares, eigenvalues, SVD) and fast matrix products; also what
# LTI systems and filter design build on
faer = ["dep:faer"]
realfft = ["dep:realfft"]
# mimalloc: the process's global allocator (for a binary or extension module that wants it; one per
# program). It keeps freed pages mapped for reuse, so a large new array is not paid for in page faults
# on first touch: 2000 x 2000 f32 `a * x + b` into a new array, 2.2 ms with the Windows heap, 0.35 ms
mimalloc = ["dep:mimalloc"]

[[bench]]
name = "dsp"
harness = false

[[example]]
name = "flux_programs"
required-features = ["flux"]

# The library is the root package; plugins and the bundler live alongside it so `autodyne` itself
# never depends on a plugin framework.
[workspace]
members = [".", "plugins/autodyne-plug", "plugins/autodyne-reverb", "plugins/autodyne-synth", "xtask"]

# Keep target/ small: dependencies build without debug info (autodyne's own code keeps it).
[profile.dev.package."*"]
debug = false
