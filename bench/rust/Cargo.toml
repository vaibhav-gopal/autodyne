[package]
name = "autodyne-compare"
version = "0.1.0"
edition = "2021"
description = "autodyne against other Rust array / tensor / linear algebra libraries (ndarray, Burn, CubeCL, faer, nalgebra) on shared axes"
license = "GPL-3.0-only"
publish = false

[dependencies]
autodyne = { path = "../..", features = ["ndarray", "flux"] }

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "flex", "wgpu", "ndarray", "autodiff"] }
criterion = "0.8"
cubecl = { version = "0.10", features = ["wgpu"] }
ndarray = "0.17"
# linear algebra, for examples/linalg.rs (bench/linalg)
dyn-stack = "0.13"
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
nalgebra = "0.34"

[features]
# mimalloc as the allocator (autodyne's feature): new arrays without page faults, for every library here
mimalloc = ["autodyne/mimalloc"]

[[bench]]
name = "compare"
harness = false

# A workspace of its own: Burn and CubeCL are heavy, and the core crate's builds shouldn't pay for them.
[workspace]
